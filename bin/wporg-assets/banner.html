<!doctype html>
<!-- Placeholder banner, rendered at 1544x500 and 772x250 by bin/wporg-assets.mjs. Replace with the final design. -->
<html>
<head>
<meta charset="utf-8">
<style>
	html, body { margin: 0; }
	body {
		width: 1544px; height: 500px; overflow: hidden; position: relative;
		background: linear-gradient(120deg, #1d35b4 0%, #3858e9 55%, #6f86ff 100%);
		font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; color: #fff;
	}
	.copy { position: absolute; left: 110px; top: 50%; transform: translateY(-50%); max-width: 680px; }
	.brand { display: flex; align-items: center; gap: 18px; margin-bottom: 30px; }
	.brand img { width: 72px; height: 72px; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,.2); }
	.brand span { font-size: 40px; font-weight: 800; letter-spacing: -.5px; }
	.brand b { color: #ffb4a8; }
	.copy h1 { font-size: 56px; line-height: 1.08; margin: 0 0 22px; font-weight: 700; letter-spacing: -1px; }
	.copy p { font-size: 24px; line-height: 1.35; margin: 0; opacity: .88; }

	/* Browser window with the post and its button. */
	.browser {
		position: absolute; left: 790px; top: 80px; width: 380px; height: 330px; background: #fff;
		border-radius: 12px; box-shadow: 0 30px 60px rgba(0,0,0,.25);
	}
	.bar { border-radius: 12px 12px 0 0; height: 34px; background: #e9ecf8; display: flex; align-items: center; gap: 7px; padding: 0 14px; }
	.bar i { width: 10px; height: 10px; border-radius: 50%; background: #b8c0e0; }
	.bar b { margin-left: 12px; height: 14px; flex: 1; border-radius: 7px; background: #fff; }
	.post { padding: 22px 28px; display: flex; flex-direction: column; gap: 10px; }
	.h { height: 16px; width: 65%; border-radius: 6px; background: #1d35b4; margin-bottom: 4px; }
	.t { height: 8px; border-radius: 4px; background: #dde3ff; }
	.gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 4px 0; }
	.gallery div { height: 64px; border-radius: 6px; }
	.g1 { background: linear-gradient(135deg, #6f86ff, #3858e9); }
	.g2 { background: linear-gradient(135deg, #f6d365, #fda085); }
	.g3 { background: linear-gradient(135deg, #00b09b, #96c93d); }
	.button {
		position: absolute; right: -36px; bottom: 30px; background: #1e1e1e; box-shadow: 0 10px 24px rgba(0,0,0,.3); color: #fff;
		font-size: 22px; font-weight: 600; padding: 16px 70px 16px 28px; border-radius: 999px;
	}

	/* The generated PDF. */
	.pdf {
		position: absolute; left: 1300px; top: 70px; width: 210px; height: 300px; background: #fff;
		border-radius: 10px; box-shadow: 0 30px 60px rgba(0,0,0,.25); padding: 40px 22px 22px;
		box-sizing: border-box; display: flex; flex-direction: column; gap: 9px;
		clip-path: polygon(0 0, 164px 0, 100% 46px, 100% 100%, 0 100%);
	}
	.fold { position: absolute; left: 1464px; top: 70px; width: 46px; height: 46px; background: #c7d1ff; border-bottom-left-radius: 8px; }
	.pdf .gallery div { height: 40px; }
	.badge {
		position: absolute; left: 1440px; top: 320px; background: #e8453c; color: #fff; font-weight: 800;
		font-size: 26px; padding: 10px 18px; border-radius: 10px; box-shadow: 0 12px 26px rgba(0,0,0,.25);
	}
	.overlay { position: absolute; inset: 0; pointer-events: none; }
</style>
</head>
<body>
	<div class="copy">
		<div class="brand"><img src="ICON"><span>Content <b>PDF</b></span></div>
		<h1>The modern PDF generator for WordPress</h1>
		<p>Posts, pages and any custom post type. Built for blocks and block themes, and works with classic themes too.</p>
	</div>
	<div class="browser">
		<div class="bar"><i></i><i></i><i></i><b></b></div>
		<div class="post">
			<div class="h"></div>
			<div class="t"></div><div class="t" style="width:85%"></div>
			<div class="gallery"><div class="g1"></div><div class="g2"></div><div class="g3"></div></div>
			<div class="t"></div><div class="t" style="width:70%"></div>
		</div>
		<div class="button">Download PDF</div>
	</div>
	<div class="pdf">
		<div class="h"></div>
		<div class="t"></div><div class="t" style="width:85%"></div>
		<div class="gallery"><div class="g1"></div><div class="g2"></div><div class="g3"></div></div>
		<div class="t"></div><div class="t"></div><div class="t" style="width:70%"></div>
		<div class="t"></div><div class="t" style="width:55%"></div>
	</div>
	<div class="fold"></div>
	<div class="badge">PDF</div>
	<svg class="overlay" width="1544" height="500" viewBox="0 0 1544 500">
		<!-- Dotted line from the button to the PDF. -->
		<path d="M1218 351 C 1262 351, 1250 220, 1292 220" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 14"/>
		<!-- Click ripple and hand cursor. -->
		<circle cx="1174" cy="351" r="13" fill="none" stroke="#fff" stroke-width="3" opacity=".9"/>
		<circle cx="1174" cy="351" r="23" fill="none" stroke="#fff" stroke-width="2" opacity=".45"/>
		<g transform="translate(1158 347) scale(2.7)" stroke="#1e1e1e" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" fill="#fff">
			<path d="M5 2.5a1.5 1.5 0 0 1 3 0V10l1-.2V8.5a1.5 1.5 0 0 1 3 0v1.6l.6-.1a1.5 1.5 0 0 1 2.4 1.2l.3-.1a1.5 1.5 0 0 1 2.2 1.3v4.6c0 2.9-2.3 5.5-5.4 5.5H9.8c-1.6 0-3-.8-3.9-2.1L2.3 14.6a1.6 1.6 0 0 1 2.3-2.2L5 12.8z"/>
		</g>
	</svg>
</body>
</html>
